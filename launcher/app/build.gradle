plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.suleman.glasstv'
        minSdk 26
        targetSdk 34
        versionCode 22
        versionName '3.5.1'
    }

    signingConfigs {
        if (rootProject.releaseKeystore) {
            release {
                storeFile file(rootProject.releaseKeystore['storeFile'])
                storePassword rootProject.releaseKeystore['storePassword']
                keyAlias rootProject.releaseKeystore['keyAlias']
                keyPassword rootProject.releaseKeystore['keyPassword']
            }
        }
    }

    buildTypes {
        // -PsideBySide installs this build next to the one already on the TV (applicationId
        // com.suleman.glasstv.debug) rather than over it. Without the flag nothing changes.
        if (project.hasProperty('sideBySide')) {
            debug {
                applicationIdSuffix '.debug'
                versionNameSuffix '-side-by-side'
            }
        }
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published. Our own key once keystore.properties is there; the debug
            // key without it, so CI and a fresh clone still build. A release APK only updates an APK signed
            // with the same key, so keep the keystore.
            signingConfig rootProject.releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
