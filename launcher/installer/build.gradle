plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome.installer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome.installer'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (rootProject.releaseKeystore) {
            release {
                storeFile file(rootProject.releaseKeystore['storeFile'])
                storePassword rootProject.releaseKeystore['storePassword']
                keyAlias rootProject.releaseKeystore['keyAlias']
                keyPassword rootProject.releaseKeystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig rootProject.releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    aaptOptions {
        noCompress 'apk'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    testImplementation 'junit:junit:4.13.2'
}
